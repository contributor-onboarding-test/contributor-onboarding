name: Review inactive members

on:
  schedule:
    # every Monday, after the daily validation
    - cron: "37 12 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check members without writing to the Sheet or removing anyone
        type: boolean
        default: true

permissions: {}

# Shared with the weekly review, so only one of them writes to the Sheet at a time.
concurrency:
  group: onboarding-sheet
  cancel-in-progress: false

jobs:
  review:
    name: Review inactive members
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: onboarding
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Get a token to check and remove organization members
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.ONBOARDING_APP_ID }}
          private-key: ${{ secrets.ONBOARDING_APP_PRIVATE_KEY }}
          # Members are checked and removed at the organization level, so the
          # App does not need access to this repository.
          owner: ${{ github.repository_owner }}
          permission-members: write

      - name: Review inactive members
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          MEMBERSHIP_ORG: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          MEMBERSHIP_TOKEN: ${{ steps.app-token.outputs.token }}
          ONBOARDING_TEAM: ${{ vars.ONBOARDING_TEAM }}
          REMOVE_INACTIVE: ${{ vars.REMOVE_INACTIVE }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python -m onboarding.inactivity
